<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành Bootstrap Grid & Flexbox</title>
    
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bước 5: Nhúng Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* Tùy chỉnh chiều cao hình ảnh Carousel cho đẹp mắt */
        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề trang dùng Font Awesome (Bước 5) -->
    <header class="bg-dark text-white text-center py-4">
        <h1><i class="fas fa-home"></i> Trang Chủ Bài Thực Hành</h1>
    </header>

    <!-- Bước 2: Áp dụng Margin & Padding để điều chỉnh khoảng cách -->
    <div class="container my-5 py-3">
        <h3 class="text-center mb-4">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>

        <!-- Bước 1: Cấu trúc Grid với 3 cột + Flexbox căn giữa -->
        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded">
                <p class="m-0 fw-bold">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white rounded">
                <p class="m-0 fw-bold">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded">
                <p class="m-0 fw-bold">Phần 3</p>
            </div>
        </div>
    </div>

    <!-- Bước 3: Sử dụng Display Property để ẩn/hiện nội dung dựa trên kích thước màn hình -->
    <div class="container my-4">
        <div class="d-none d-md-block bg-warning text-center p-3 rounded fw-bold">
            <p class="m-0"><i class="fas fa-info-circle"></i> Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px (Màn hình máy tính / Tablet ngang)</p>
        </div>
    </div>

    <!-- Bước 4: Tạo Carousel (Slideshow hình ảnh) -->
    <div class="container my-5">
        <h4 class="text-center mb-3">Hình Ảnh Nổi Bật</h4>
        <div id="myCarousel" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <!-- Bước 6 & Bước 5: Tạo Contact Form kết hợp nút bấm có biểu tượng Font Awesome -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4 shadow-sm">
                    <h3 class="card-title text-center mb-4"><i class="fas fa-envelope"></i> Biểu Mẫu Liên Hệ</h3>
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Nhập email">
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Nội dung</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane"></i> Gửi
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
